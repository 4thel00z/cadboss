[package]
name = "cadboss-cli"
description = "Command-line interface for cadboss"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cadboss"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
cadboss-core.workspace = true
cadboss-model.workspace = true
cadboss-dxf.workspace = true
cadboss-output.workspace = true
cadboss-tui.workspace = true
clap.workspace = true
tokio = { version = "1", features = ["rt", "time"] }
serde.workspace = true
serde_json.workspace = true
jaq-core.workspace = true
jaq-std.workspace = true
jaq-json = { workspace = true, features = ["serde"] }

[dev-dependencies]
cadboss-testkit = { path = "../cadboss-testkit" }
