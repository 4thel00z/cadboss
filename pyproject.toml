[project]
name = "cadboss"
version = "0.1.1" # x-release-please-version
description = "From-scratch Rust reader for CAD files"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT OR Apache-2.0" }

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = ["maturin>=1.7", "pytest"]

[tool.maturin]
python-source = "python"
module-name = "cadboss._cadboss"
manifest-path = "crates/cadboss-py/Cargo.toml"
features = ["pyo3/extension-module"]
