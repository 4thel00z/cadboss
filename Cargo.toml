[workspace]
resolver = "2"
members = [
    "crates/cadboss-core",
    "crates/cadboss-model",
    "crates/cadboss-dxf",
    "crates/cadboss-output",
    "crates/cadboss-cli",
    "crates/cadboss-py",
    "crates/cadboss-testkit",
]

[workspace.package]
version = "0.1.0" # x-release-please-version
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/4thel00z/cadboss"
readme = "README.md"
keywords = ["cad", "dxf", "dwg", "step", "ifc"]

[workspace.dependencies]
cadboss-core = { path = "crates/cadboss-core", version = "0.1.0" } # x-release-please-version
cadboss-model = { path = "crates/cadboss-model", version = "0.1.0" } # x-release-please-version
cadboss-dxf = { path = "crates/cadboss-dxf", version = "0.1.0" } # x-release-please-version
cadboss-output = { path = "crates/cadboss-output", version = "0.1.0" } # x-release-please-version
cadboss-testkit = { path = "crates/cadboss-testkit", version = "0.1.0" } # x-release-please-version
thiserror = "2"
memmap2 = "0.9"
memchr = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4.6", features = ["derive"] }
jaq-core = "3"
jaq-std = "3"
jaq-json = "2"
pyo3 = { version = "0.25", features = ["abi3-py312"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
